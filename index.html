<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수목 관리 실습 VR</title>
<style>
  /* 배치: 가운데 나무, 왼쪽 안내 카드, 오른쪽 조작 카드 (좁은 화면은 위·아래) */
  :root { color-scheme: light; --sky: #d7e6ea; --paper: rgba(244, 246, 239, .95); --ink: #26302a; --forest: #2f4a36; --gold: #e6ad3c; --muted: #5b6b5a; --line: #cdd1c2; --bad: #b5412f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); }
  body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif; color: var(--ink); -webkit-text-size-adjust: 100%; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .card { pointer-events: auto; position: absolute; box-sizing: border-box; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 10px rgba(40, 50, 40, .12); overflow: auto; }
  #infoCard { left: 12px; top: 12px; width: 340px; max-height: calc(100% - 24px); }
  #infoCard header { background: var(--forest); color: #fff; padding: 12px 16px 12px; }
  #infoCard h1 { font-size: 22px; margin: 0; line-height: 1.25; }
  #iType { margin: 2px 0 9px; font-size: 13px; color: #cfe0cf; }
  #iSteps { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0; font-size: 12px; font-weight: 700; }
  #iSteps li { padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .14); color: #cfe0cf; }
  #iSteps li.cur { background: var(--gold); color: #2a2a1c; }
  .pad { padding: 12px 16px 14px; }
  details summary { font-weight: 700; color: var(--forest); cursor: pointer; font-size: 14px; }
  #iList { margin: 6px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
  #iList li { margin-bottom: 3px; }
  #iProg { font-weight: 700; color: #4d6b7a; font-size: 14px; margin: 10px 0; }
  #iProg.prompt { color: var(--bad); }
  .fb { border-left: 5px solid #4d6b7a; background: #e6edf0; border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; white-space: pre-line; text-wrap: pretty; }
  .fb.good { background: #e2f0dd; border-color: #3a7d44; }
  .fb.warn { background: #fbefd0; border-color: #c58a1c; }
  .fb.bad { background: #f8dcd6; border-color: var(--bad); }
  .score { display: flex; align-items: baseline; gap: 6px; color: var(--forest); }
  .score b { font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score span { font-size: 18px; font-weight: 700; }
  .score small { margin-left: auto; font-size: 12px; color: #6b7468; }
  #iRows { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px; }
  #iRows td { padding: 4px 0; border-bottom: 1px solid #e2dece; }
  #iRows td:last-child { text-align: right; font-weight: 700; color: var(--forest); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #iRows td.neg { color: var(--bad); }
  #iNotes { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; }
  #ctlCard { right: 12px; top: 12px; width: 300px; padding: 12px 14px 14px; max-height: calc(100% - 24px); }
  .sec h2 { font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 700; }
  .sec:first-child h2 { margin-top: 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn { font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .btn .l { font-weight: 700; font-size: 14.5px; }
  .btn .s { font-size: 11.5px; opacity: .85; }
  .btn:hover:not(:disabled):not(.on):not(.primary) { background: #eef5ea; }
  .btn.on { background: var(--forest); border-color: var(--forest); color: #fff; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #2a2a1c; }
  .btn.full { grid-column: 1 / -1; }
  .btn:disabled { background: #eceadf; color: #aaa797; border-color: #dedbcd; cursor: default; }
  .btn:focus-visible, #vrbtn:focus-visible { outline: 3px solid #1f6feb; outline-offset: 2px; }
  #vrbox { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  #vrbtn { font: inherit; font-weight: 700; font-size: 15px; width: 100%; color: #fff; background: var(--forest); border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
  #vrbtn:disabled { background: #a9a698; cursor: default; }
  #vrnote { font-size: 12px; color: var(--muted); margin: 7px 0 0; line-height: 1.45; }
  .hint { pointer-events: none; position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 7px 16px; font-size: 13px; white-space: nowrap; }
    .zoom { pointer-events: auto; position: absolute; right: 328px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .zoom button { font: inherit; font-size: 20px; line-height: 1; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--forest); cursor: pointer; touch-action: manipulation; }
  .zoom button:hover { background: #eef5ea; }
  .zoom button:focus-visible { outline: 3px solid #1f6feb; outline-offset: 2px; }
  @media (max-width: 899px) {
    .zoom { right: 8px; bottom: 278px; }
    .zoom button { width: 44px; height: 44px; }
    #infoCard { left: 8px; right: 8px; top: 8px; width: auto; max-height: 190px; }
    #infoCard header { padding: 8px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    #infoCard h1 { font-size: 17px; } #iType { display: none; }
    .pad { padding: 8px 12px 10px; } .fb, #iList { font-size: 13px; } .fb { padding: 7px 10px; } #iProg { margin: 5px 0; font-size: 13px; }
    #ctlCard { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 262px; padding: 8px 10px; }
    .sec h2 { display: none; } .sec + .sec { margin-top: 5px; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 5px; }
    .btn { min-height: 42px; padding: 3px 4px; } .btn .l { font-size: 13px; } .btn .s { font-size: 10.5px; } .btn.full { grid-column: auto; }
    #vrbox { display: flex; align-items: center; gap: 10px; margin-top: 7px; padding-top: 7px; }
    #vrbtn { width: auto; white-space: nowrap; padding: 8px 12px; font-size: 13px; } #vrnote { margin: 0; font-size: 11px; }
    .hint { display: none; }
    .score b { font-size: 40px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <section class="card" id="infoCard" aria-live="polite">
    <header>
      <h1 id="iTitle">수목 전지 실습</h1>
      <p id="iType"></p>
      <ol id="iSteps"></ol>
    </header>
    <div class="pad">
      <div id="iWork">
        <details id="iBody"><summary id="iSum">과제</summary><ul id="iList"></ul></details>
        <p id="iProg"></p>
        <div class="fb" id="iFb"></div>
      </div>
      <div id="iResult" hidden>
        <div class="score"><b id="iScore">0</b><span>점</span><small id="iGuide"></small></div>
        <table id="iRows"></table>
        <ul id="iNotes"></ul>
      </div>
    </div>
  </section>
  <section class="card" id="ctlCard">
    <div id="ctlSections"></div>
    <div id="vrbox"><button id="vrbtn" type="button" disabled>VR 확인 중</button><p id="vrnote">VR 지원 여부를 확인하는 중입니다.</p></div>
  </section>
  <div class="zoom" aria-label="보기 조절">
    <button type="button" id="zoomIn" aria-label="확대">＋</button>
    <button type="button" id="zoomOut" aria-label="축소">－</button>
    <button type="button" id="zoomFit" aria-label="처음 보기">⌂</button>
  </div>
  <div class="hint" id="hint"></div>
</div>
